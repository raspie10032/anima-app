name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU test runtime
        run: |
          python -m pip install --upgrade pip "setuptools>=69" wheel
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest "ruff==0.14.14"
      - name: Lint Python
        run: python -m ruff check src tests scripts
      - name: Check browser JavaScript
        run: |
          node --check src/anima_app/static/app.js
          node --check src/anima_app/static/setup.js
          node --check src/anima_app/static/barracks.js
          node --check src/anima_app/static/library.js
          node --check src/anima_app/static/i18n.js
          node --check src/anima_app/static/authoring.js
          node --check src/anima_app/static/generation.js
          node --check src/anima_app/static/workflow.js
          node --check src/anima_app/static/nai-i18n.js
          node --check src/anima_app/static/nai-errors.js
      - name: Run CPU-safe tests
        run: python -m pytest -q
      - name: Verify vendored package integrity
        run: python scripts/verify_vendor.py
      - name: Verify wheel boundary
        if: matrix.python-version == '3.13'
        run: python scripts/package_dry_run.py
      - name: Build source-checkout candidate
        if: matrix.python-version == '3.13'
        run: python scripts/source_archive.py --require-clean --output-dir "${{ runner.temp }}/release"
      - name: Retain verified source candidate
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: anima-app-source-candidate
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install pytest
      - name: Verify Windows launcher behavior
        run: python -m pytest tests/test_launchers.py -q
