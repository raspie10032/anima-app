[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anima-app"
dynamic = ["version"]
description = "Lightweight standalone Anima image generation app"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "torch",
  "torchvision",
  "torchsde",
  "numpy>=1.25.0",
  "Pillow",
  "requests>=2.31.0",
  "keyring>=25.6,<26",
  "einops",
  "transformers>=5.16.1,<6",
  "tokenizers>=0.13.3",
  "sentencepiece",
  "safetensors>=0.4.2",
  "scipy",
  "tqdm",
  "psutil",
  "PyYAML",
  "simpleeval>=1.0.0",
  "blake3",
  "huggingface_hub>=0.23.0",
]

[project.optional-dependencies]
face-detailer = [
  "ultralytics>=8.4.0",
  "segment-anything>=1.0",
]
wd-matching = [
  "timm>=1.0.20,<2",
  "huggingface-hub>=1.1,<2",
]
pixai-matching = [
  "timm>=1.0.20,<2",
  "huggingface-hub>=1.1,<2",
  "transformers>=5,<6",
]
sam3 = [
  "ultralytics>=8.4.0",
  "clip @ git+https://github.com/ultralytics/CLIP.git@7ffa84b3bfa40c42ecc1c77147a855e69cb2dd40",
]

[project.scripts]
anima-app = "anima_app.cli:console_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anima_app = ["static/*.js", "static/*.json", "static/*.css"]
"anima_app._vendor.vrs_int" = ["*.json", "LICENSE*"]
"anima_app._vendor.swegca" = ["*.json", "LICENSE*"]

[tool.setuptools.dynamic]
version = {attr = "anima_app.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
